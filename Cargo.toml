[package]
name = "rvet"
description = "CLI tool for processing traces in the RISC-V E-Trace format"
authors = ["Julian Ganz <ganz@fzi.de>"]
license = "Apache-2.0"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
riscv-etrace = { version = "0.7", features = ["alloc", "serde"] }
toml = { version = "0.9", features = ["parse"] }
